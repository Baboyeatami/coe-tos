name: Test portable workflow
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/coe-tos/scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_skill.py --out dist/coe-tos.zip
